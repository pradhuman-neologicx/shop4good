<section class="w-full max-w-7xl mx-auto px-4 py-8 md:py-14 font-sans">

      <span class="text-[11px] sm:text-xs font-semibold uppercase tracking-[0.16em] mb-2 sm:mb-3 text-white/80 block font-heading">
        REAL IMPACT
      </span>
      <h2 class="text-3xl md:text-4xl lg:text-[44px] font-bold text-white leading-[2.5rem] mb-2.5 sm:mb-3.5 font-heading tracking-wider">
        Small Purchases.<br/>Big Change.
      </h2>
      <p class="text-white/80 text-xs sm:text-sm md:text-[15px] leading-relaxed mb-5 sm:mb-6 max-w-sm font-normal">

      <div class="w-full sm:w-auto">

            <div class="text-[22px] sm:text-2xl md:text-[22px] lg:text-[26px] font-bold leading-none md:leading-tight mb-1.5 md:mb-0.5 font-heading text-white">

            <svg class="hidden md:block w-5 h-5" fill="none" stroke="#087F6A" stroke-width="1.8" viewBox="0 0 24 24">

            <i class="fa-solid fa-users text-[#1B9C55] text-lg sm:text-xl md:hidden"></i>
            <svg class="hidden md:block w-5 h-5" fill="none" stroke="#087F6A" stroke-width="1.8" viewBox="0 0 24 24">

            </div>
            <div class="text-white/80 text-xs sm:text-[13px] leading-snug font-normal">

        <!-- Stat 4: Animals supported -->

          <div>
            <div class="text-[22px] sm:text-2xl md:text-[22px] lg:text-[26px] font-bold leading-none md:leading-tight mb-1.5 md:mb-0.5 font-heading text-white">
              3,100+

            <div class="text-white/80 text-xs sm:text-[13px] leading-snug font-normal">

            </div>
          </div>

      </div>
