<section class="max-w-7xl mx-auto px-4 py-8 md:py-12 font-sans bg-white">
  <!-- Header Section -->
  <div class="mb-6 md:mb-10  text-left sm:text-center">
    <h2 class="text-[26px] md:text-[32px] font-bold text-[#08265C] mb-2 leading-tight font-heading">
      Choose the Causes & Charity you<br class="hidden md:block"/> want to support
    </h2>
    <p class="text-gray-500 text-sm md:text-base mt-2 md:mt-3">
      Choose the stories you want to help write with every purchase.
    </p>
  </div>

  <!-- Cards Grid -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
    @for (cause of causes; track cause.id) {
      <div 
        class="rounded-[16px] text-white flex flex-col relative cursor-pointer transition-transform duration-300 hover:scale-[1.02] active:scale-[0.98] h-full shadow-sm hover:shadow-md overflow-hidden"
        [style.backgroundColor]="cause.bgColor"
        [routerLink]="['/causes-new', cause.id]"
        (click)="selectCause(cause.id)"
      >
        <!-- Main Card Body -->
        <div class="p-3 sm:p-4 flex flex-col flex-grow">
          <!-- Circle / Checkbox Top Left -->
          <div class="mb-3">
            <div class="w-5 h-5 md:w-[22px] md:h-[22px] rounded-full border-2 flex items-center justify-center transition-all duration-300"
                 [class.border-white]="selectedCauseId !== cause.id"
                 [class.border-transparent]="selectedCauseId === cause.id"
                 [class.bg-white]="selectedCauseId === cause.id">
                 @if(selectedCauseId === cause.id) {
                   <svg class="w-3 h-3 md:w-3.5 md:h-3.5" [style.color]="cause.bgColor" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                 }
            </div>
          </div>

          <!-- Image -->
          <div class="rounded-xl overflow-hidden mb-4 relative aspect-square w-full shrink-0 bg-black/10">
            <img [src]="cause.image" [alt]="cause.title" class="w-full h-full object-cover grayscale brightness-90 hover:grayscale-0 transition-all duration-500">
          </div>

          <!-- Content -->
          <h3 class="text-base md:text-lg font-semibold mb-1 leading-tight font-heading">{{ cause.title }}</h3>
          <p class="text-[11px] md:text-[13px] text-white/90 leading-snug font-light">{{ cause.subtitle }}</p>
        </div>

        <!-- Footer Bar -->
        <div class="bg-[#24272C] px-4 py-3 flex items-center justify-between border-t border-white/60 group mt-auto shrink-0">
          <span class="text-[9px] md:text-[11px] font-medium text-white truncate mr-2">{{ cause.foundation }}</span>
          <a href="javascript:void(0)" class="text-white/80 group-hover:text-white transition-colors shrink-0" (click)="$event.stopPropagation()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 md:h-4 md:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
      </div>
    }
  </div>
</section>
