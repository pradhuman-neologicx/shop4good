<div class="min-h-screen flex items-center justify-center bg-slate-50 relative py-12 px-4 sm:px-6 lg:px-8">
  <div class="absolute inset-0 bg-gradient-to-br from-[#032826] to-[#05413e] opacity-5"></div>
  <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.03]"></div>
  
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden relative z-10 border border-slate-100">
    <div class="p-8 sm:p-12">
      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <a routerLink="/">
          <img src="assets/logo.png" alt="Shop4Good" class="h-12 w-auto object-contain" />
        </a>
      </div>

      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h2>
        <p class="text-slate-500 text-sm">Sign in to your Shop4Good account to track your donations and choose your causes.</p>
      </div>

      <form class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="email" id="email" name="email" placeholder="you@example.com" required 
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
            <a href="#" class="text-sm font-medium text-emerald-600 hover:text-emerald-500">Forgot password?</a>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" placeholder="••••••••" required 
              class="w-full pl-10 pr-12 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" />
            <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 transition-colors focus:outline-none">
              <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        <!-- <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded">
          <label for="remember-me" class="ml-2 block text-sm text-slate-600">
            Remember me
          </label>
        </div> -->

        <div>
          <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all">
            Sign In
          </button>
        </div>
      </form>
    </div>
    
    <div class="bg-slate-50 px-8 py-6 border-t border-slate-200 text-center">
      <p class="text-sm text-slate-600">
        Don't have an account? 
        <a routerLink="/auth/register" class="font-bold text-emerald-600 hover:text-emerald-500">Sign up now</a>
      </p>
    </div>
  </div>
</div>
