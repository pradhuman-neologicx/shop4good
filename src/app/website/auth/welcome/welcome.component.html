<!-- ── BACKDROP ── -->
<div
  class="fixed inset-0 z-[9999] flex items-center justify-center p-4 font-sans"
  (click)="onBackdropClick($event)"
>
  <!-- Blurred dark overlay -->
  <div class="absolute inset-0 bg-black/50 backdrop-blur-[3px]" aria-hidden="true"></div>

  <!-- ── MODAL CARD ── -->
  <div
    class="relative w-full max-w-[400px] bg-white rounded-[24px] shadow-2xl border border-slate-100 p-7 sm:p-8 flex flex-col items-center text-center animate-in"
    (click)="$event.stopPropagation()"
  >
    <!-- Close Button -->
    <button
      type="button"
      (click)="close()"
      class="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors cursor-pointer"
      title="Close"
    >
      <i class="fa-solid fa-xmark text-sm"></i>
    </button>

    <!-- Logo -->
    <a routerLink="/" class="inline-block mb-5" (click)="close()">
      <img src="assets/logo.png" alt="Shop4Good" class="h-10 w-auto object-contain" />
    </a>

    <!-- Heading -->
    <h2 class="text-xl sm:text-2xl font-extrabold text-[#08265C] font-heading leading-tight mb-1">
      Join us to change the world
    </h2>
    <p class="text-xs text-gray-500 leading-relaxed mb-6 max-w-[270px]">
      Shop with the brands you love and support the causes that matter.
    </p>

    <!-- Sign Up Button -->
    <button
      type="button"
      (click)="goToRegister()"
      class="w-full py-3 px-5 rounded-full bg-[#087F6A] hover:bg-[#066c5a] text-white font-semibold text-sm transition-colors duration-200 shadow-sm mb-3 cursor-pointer"
    >
      Sign up
    </button>

    <!-- Login Button -->
    <button
      type="button"
      (click)="goToLogin()"
      class="w-full py-3 px-5 rounded-full border border-slate-200 hover:border-[#087F6A] hover:bg-emerald-50 text-[#08265C] font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      Log in
    </button>

    <!-- Divider -->
    <div class="w-full flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-slate-100"></div>
      <span class="text-xs text-slate-400 font-medium">or continue with</span>
      <div class="flex-1 h-px bg-slate-100"></div>
    </div>

    <!-- Social Auth Buttons -->
    <div class="flex items-center justify-center gap-3">
      <!-- Google -->
      <button
        type="button"
        class="w-12 h-12 rounded-full border border-slate-200 hover:border-slate-300 hover:bg-slate-50 flex items-center justify-center transition-colors cursor-pointer shadow-2xs"
        title="Continue with Google"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </button>

      <!-- Apple -->
      <button
        type="button"
        class="w-12 h-12 rounded-full border border-slate-200 hover:border-slate-300 hover:bg-slate-50 flex items-center justify-center transition-colors cursor-pointer shadow-2xs"
        title="Continue with Apple"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.42.07 2.41.74 3.24.8 1.23-.24 2.41-.93 3.65-.84 1.55.12 2.72.74 3.48 1.9-3.18 1.9-2.43 5.86.48 7.03-.56 1.47-1.31 2.93-2.85 3.99zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
      </button>

      <!-- Email -->
      <button
        type="button"
        (click)="goToLogin()"
        class="w-12 h-12 rounded-full border border-slate-200 hover:border-slate-300 hover:bg-slate-50 flex items-center justify-center transition-colors cursor-pointer shadow-2xs"
        title="Continue with Email"
      >
        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
        </svg>
      </button>
    </div>

    <!-- Terms -->
    <p class="text-[10px] text-slate-400 mt-5 leading-relaxed max-w-[280px]">
      By continuing, you agree to our
      <a routerLink="/terms-and-conditions" (click)="close()" class="underline hover:text-slate-600">Terms & Conditions</a>
      and
      <a routerLink="/privacy-policy" (click)="close()" class="underline hover:text-slate-600">Privacy Policy</a>.
    </p>
  </div>
</div>
